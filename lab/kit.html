<!doctype html><meta charset="utf-8"><title>kit lab</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<body style="background:#f3eee3;padding:40px;display:grid;gap:34px;font-family:system-ui">
<div style="display:flex;gap:18px;flex-wrap:wrap;align-items:end"><piix-button>Get started</piix-button><piix-button tone="coral" pal="bitbug">Deploy</piix-button><piix-button tone="violet" size="lg">Big one</piix-button><piix-button tone="sky" size="sm">Small</piix-button><piix-button tone="ink" pal="pip">Ink</piix-button><piix-button disabled>Off</piix-button></div>
<div style="display:flex;gap:30px;flex-wrap:wrap"><piix-toggle checked>Dark mode</piix-toggle><piix-toggle pal="penguin" tone="sky">Snow</piix-toggle><piix-checkbox checked>Updates</piix-checkbox><piix-checkbox tone="coral">Terms</piix-checkbox></div>
<piix-progress value="62" style="width:420px"></piix-progress><piix-progress value="100" tone="sun" pal="bitbug" style="width:420px"></piix-progress><piix-progress style="width:420px" tone="violet"></piix-progress>
<script src="../piixpal.js"></script>
