<!doctype html>
<meta charset="utf-8">
<title>Piixpal print lab</title>
<style>
  body { margin: 0; padding: 16px; background: #111; color: #ddd; font: 12px ui-monospace, monospace }
  .g { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px }
  figure { margin: 0 } figcaption { padding: 3px 0 }
  piix-backdrop { height: 170px }
</style>
<body>
<div class="g" id="scenes"></div>
<div class="g" id="bds"></div>
<script src="../piixpal.js"></script>
<script>
  for (const s of ['kiss', 'heartbreak', 'umbrella', 'stargaze', 'alone', 'hug', 'heart', 'campfire']) scenes.insertAdjacentHTML('beforeend', `<figure><piix-scene scene="${s}" cell="5"></piix-scene><figcaption>${s}</figcaption></figure>`);
  for (const k of ['aurora', 'sunburst', 'plasma', 'rain', 'stars', 'clouds', 'tunnel', 'synthwave', 'fire', 'waves']) bds.insertAdjacentHTML('beforeend', `<figure><piix-backdrop kind="${k}" height="170"></piix-backdrop><figcaption>${k}</figcaption></figure>`);
</script>
